# One command, no API keys. Three API nodes rather than one, because the
# question this repository exists to answer — how long until *every* node
# denies — is not a question you can ask a single process.
name: permguard

x-api-env: &api-env
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: permguard
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: redpanda:9092
  # The backstop poll. Active invalidation is the fast path; this is the bound
  # on how long a node can be stale when the fast path drops a message.
  GENERATION_BACKSTOP_MS: "5000"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: permguard
    ports: ["${PGPORT_HOST:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d permguard"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Not in the serving path. Behind a profile so `docker compose up` does not
  # start it, and `docker compose --profile bench up -d neo4j` does — which is
  # all `npm run bench:graph` needs. ADR-0005 is why it is not a dependency of
  # anything else in this file.
  neo4j:
    profiles: ["bench"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/permguard1
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      - "${NEO4J_BOLT_HOST:-57787}:7687"
      - "${NEO4J_HTTP_HOST:-57574}:7474"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT_HOST:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,EXTERNAL://localhost:19092
    ports: ["${REDPANDA_PORT_HOST:-19092}:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Migrations, seed data, and the graph's first projection. Runs once and exits
  # so the API nodes never race an empty schema.
  bootstrap:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    command: ["node", "apps/worker/dist/bootstrap.js"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    restart: "no"

  # Outbox relay + graph projector + audit writer. One instance: the relay is
  # safe to run several of (SKIP LOCKED), but the projector is not, and running
  # them together keeps the ordering in ADR-0003 easy to reason about.
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    environment: *api-env
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3910/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["${WORKER_PORT_HOST:-3910}:3910"]

  api1: &api
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *api-env
      NODE_ID: api1
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    ports: ["3901:3900"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3900/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api2:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: api2
    ports: ["3902:3900"]

  api3:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: api3
    ports: ["3903:3900"]

  # The browser talks to the API nodes on their published host ports, not
  # through this container — showing three nodes disagreeing means reaching all
  # three separately. So there is no API_NODES here: the default baked into
  # `apps/web/lib/api.ts` is localhost:3901-3903, which is what this file
  # publishes.
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api1: { condition: service_healthy }
    ports: ["3900:3000"]
